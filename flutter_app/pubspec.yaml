name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  http: ^1.1.0
  # USB/OTG webcam over UVC — the tablet does not expose it to the camera service.
  uvccamera: ^0.0.13
  permission_handler: ^12.0.1
  path_provider: ^2.1.2
  path: ^1.8.3
  google_fonts: ^6.1.0
  # 0.10.4 uses UnmodifiableUint8ListView which was removed in Dart 3.x.
  # 0.12.1 is the first version with the fix + LiteRT 1.4.0 + 16KB page support.
  tflite_flutter: ^0.12.1
  image: ^4.0.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/svce_logo.png
    - assets/models/crop_model_float16.tflite
    - assets/models/class_names.json
