spring.application.name=spring_backend

# All values can be overridden with environment variables, e.g.
#   SERVER_PORT=8000 AI_SERVICE_URL=http://ml-host:5010 java -jar spring_backend.jar
server.port=${SERVER_PORT:8000}

# Python ML service
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:5010}
ai.service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:5s}
ai.service.read-timeout=${AI_SERVICE_READ_TIMEOUT:60s}

# Uploads (phone/tablet photos are often > 1 MB, Spring's default)
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# Logging
logging.level.root=${LOG_LEVEL:INFO}

# Actuator: expose only health
management.endpoints.web.exposure.include=health
